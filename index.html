<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoQuest – Gamified Environmental Education Platform for Schools and Colleges</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16'
            }
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for In-Browser JSX Parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js for Environmental & Diagnostic Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti for Gamified Celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-[#f8faf8] text-[#1a2e22] antialiased selection:bg-emerald-200 selection:text-emerald-900">
  <div id="root">
    <!-- Initial Fallback Loader -->
    <div class="min-h-screen flex items-center justify-center bg-[#f8faf8]">
      <div class="text-center space-y-4">
        <div class="w-16 h-16 rounded-3xl bg-emerald-600 text-white flex items-center justify-center text-3xl mx-auto shadow-xl shadow-emerald-600/30 animate-bounce">
          🌿
        </div>
        <h2 class="text-xl font-bold font-heading text-emerald-950">Loading EcoQuest Platform...</h2>
        <p class="text-xs text-slate-500">Preparing environmental curriculum, game engine & AI diagnostic model</p>
      </div>
    </div>
  </div>

  <!-- Data Sets (Vanilla JS) -->
  <script src="js/data/topicsData.js"></script>
  <script src="js/data/quizzesData.js"></script>
  <script src="js/data/missionsData.js"></script>
  <script src="js/data/badgesData.js"></script>
  <script src="js/data/leaderboardData.js"></script>
  <script src="js/data/mockUsers.js"></script>

  <!-- Utilities (Vanilla JS) -->
  <script src="js/utils/audio.js"></script>
  <script src="js/utils/aiEngine.js"></script>
  <script src="js/utils/storage.js"></script>

  <!-- React Components (JSX parsed by Babel) -->
  <script type="text/babel" src="js/components/Toast.js"></script>
  <script type="text/babel" src="js/components/AuthModal.js"></script>
  <script type="text/babel" src="js/components/Navbar.js"></script>
  <script type="text/babel" src="js/components/Footer.js"></script>
  <script type="text/babel" src="js/components/LandingPage.js"></script>
  <script type="text/babel" src="js/components/AboutPage.js"></script>
  <script type="text/babel" src="js/components/LearnPage.js"></script>
  <script type="text/babel" src="js/components/QuizPage.js"></script>
  <script type="text/babel" src="js/components/MissionsPage.js"></script>
  <script type="text/babel" src="js/components/LeaderboardPage.js"></script>
  <script type="text/babel" src="js/components/BadgesPage.js"></script>
  <script type="text/babel" src="js/components/StudentDashboard.js"></script>
  <script type="text/babel" src="js/components/TeacherDashboard.js"></script>
  <script type="text/babel" src="js/components/ImpactDashboard.js"></script>
  <script type="text/babel" src="js/components/ProfilePage.js"></script>

  <!-- Main App Component & Mount (JSX) -->
  <script type="text/babel" src="js/app.js"></script>
  <script type="text/babel">
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<window.EcoQuest.App />);
  </script>
</body>
</html>
